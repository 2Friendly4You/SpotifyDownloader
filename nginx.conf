server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the app container at request time so nginx can start
    # before the API container is registered in Docker DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream spotifydownloader-app:5000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /socket.io/ {
        set $socket_upstream spotifydownloader-app:5000;
        proxy_pass http://$socket_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /music/ {
        alias /var/www/SpotifyDownloader/;
        autoindex off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
